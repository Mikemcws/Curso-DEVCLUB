<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cash - Controle Financeiro</title>
    <link rel="stylesheet" href="./style.CSS">    
       
</head>

<body>

    <header>
        <h1>Fluxo Dia a Dia</h1>
        <p>Seu Controle Financeiro Diário</p>
    </header>

    <main>

        <section class="resumo-financeiro">

            <div class="card entradas">
                <h2>Entradas</h2>
                <p>R$0,00</p>
            </div>

            <div class="card saidas">
                <h2>Saídas</h2>
                <p>R$0,00</p>
            </div>

            <div class="container"></div>

        </section>
        </section>

        <section>

            <h2>Adicionar Transação </h2>
            <form>
                <input type="text" placeholder="Descrição">
                <input type="number" placeholder="Valor">
                <select>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>

                <button type="submit">Adicionar</button>

            </form>

            <section>
                <h2>Histórico de Transações</h2>
                <ul>
                    <li>Descrição: Salário - Valor: R$0,00 - Tipo: Entrada</li>
                    <li>Descrição: Aluguel - Valor: R$0,00 - Tipo: Saída</li>
                </ul>

            </section>

            <p id="saldo"> </p>
        </section>



    </main>

</html>


























</body>
